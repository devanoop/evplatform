# Curated specs for the India launch list (Rs 10-25 lakh segment, first-time EV buyers).
#
# Why curated: no open dataset covers Indian-market EVs (Open EV Data has no Tata, Mahindra or
# Maruti; Wikidata coverage is thin), and most Indian OEM and aggregator sites forbid scraping
# in their terms. So these numbers are entered by hand from published launch coverage, with the
# source on every model. The oem_pages source (data/oem_pages.yaml) can refresh them later from
# official pages where robots.txt and the site's terms allow it.
#
# Rules: only enter numbers the cited source states. Leave anything unstated out (null) rather
# than guess. Prices are ex-showroom as published at the time of the source and change often.
# power_ps / power_hp are converted to kW on load. Prices are in lakh and converted to rupees.

